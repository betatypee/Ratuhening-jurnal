<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Pribadiku</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Georgia', serif; 
            background-color: #faf8f5; 
            color: #2b2b2b; 
            line-height: 1.8; 
            padding: 20px; 
        }
        .container { max-width: 650px; margin: 40px auto; }
        header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 2.2rem; font-weight: normal; letter-spacing: 1px; }
        p.subtitle { color: #777; font-style: italic; font-size: 0.95rem; }
        
        .entry { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 8px; 
            margin-bottom: 30px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            border: 1px solid #eae6df;
        }
        .date { font-size: 0.85rem; color: #8c8c8c; margin-bottom: 8px; font-family: sans-serif; }
        .entry h2 { font-size: 1.4rem; margin-bottom: 12px; color: #1a1a1a; }
        .entry p { font-size: 1rem; color: #4a4a4a; white-space: pre-line; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Jurnal Harian</h1>
            <p class="subtitle">Ruang tenang untuk mengikat kata dan rasa.</p>
        </header>

        <!-- Postingan Jurnal 1 -->
        <article class="entry">
            <div class="date">17 Agustus 2026</div>
            <h2>Langkah Pertama</h2>
            <p>Hari ini aku resmi memulai website jurnal pribadiku sendiri. Senang rasanya punya ruang sendiri di internet tanpa gangguan algoritma sosial media.</p>
        </article>

    </div>

</body>
</html>

    </div>

</body>
</html>
